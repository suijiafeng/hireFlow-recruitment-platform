name: hireflow

services:
  postgres:
    image: postgres:18-alpine
    container_name: hireflow-postgres
    environment:
      POSTGRES_USER: arthr
      POSTGRES_PASSWORD: arthr_dev_password
      POSTGRES_DB: arthr
    ports:
      - '5432:5432'
    volumes:
      # postgres:18 镜像的数据卷挂载点是 /var/lib/postgresql（非旧版的 .../data）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arthr -d arthr']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: hireflow-redis
    ports:
      - '6379:6379'

volumes:
  pgdata:
