# HireFlow - AI-Powered Recruitment Platform
# Demo environment web entry: static site + /api reverse proxy (same as vite dev proxy)
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 简历/证件上传 ≤10MB，留余量
  client_max_body_size 20m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 后端接口：保留 /api 前缀转发（api 服务已 setGlobalPrefix('api')）
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI 生成类接口最长 60s + 重试，放宽读超时
    proxy_read_timeout 180s;
  }

  # 指纹化静态资源长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA 路由回退（/portal/* 免登录直链、刷新任意路由）
  location / {
    try_files $uri $uri/ /index.html;
  }
}
